<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Actividad</title>
  <link rel="stylesheet" href="style.css">
  <script src="region_comuna.js" defer></script>
  <script src="form.js" defer></script>

</head>
<body>
  <header>
    <h1>Formulario de Nueva Actividad</h1>
  </header>
  <main>
    <form id="form-actividades">
      <h3>Información del Lugar</h3>
    

      <label for="region">Región:</label>
      <select id="region" name="region">
        <option value="">Seleccione una región</option>
      </select>

      <label for="comuna">Comuna:</label>
      <select id="comuna" name="comuna" disabled>
        <option value="">Seleccione una comuna</option>
      </select>


      <label for="sector">Sector</label>
      <input type="text" id="sector">

      <h3>Datos del Organizador</h3>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre">

      <label for="email">Email</label>
      <input type="text" id="email">

      <label for="telefono">Número de celular</label>
      <input type="text" id="telefono" placeholder="+56912345678">

      <label for="contactar-por">Contactar por</label>
      <select id="contactar-por">
        <option value="">Seleccione una opción</option>
        <option value="whatsapp">WhatsApp</option>
        <option value="telegram">Telegram</option>
        <option value="x">X</option>
        <option value="instagram">Instagram</option>
        <option value="tiktok">TikTok</option>
        <option value="otra">Otra</option>
      </select>
      
      <div id="id-red-social-container" style="display: none;">
        <label for="id-red-social">ID o URL de red social</label>
        <input type="text" id="id-red-social">
      </div>
      
      <h3>Información de la Actividad</h3>
      <label for="dia-hora-inicio">Día y Hora de Inicio</label>
      <input type="datetime-local" id="dia-hora-inicio">

      <label for="dia-hora-fin">Día y Hora de Término</label>
      <input type="datetime-local" id="dia-hora-fin">

      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" rows="4"></textarea>

      <label for="tema">Tema</label>
      <select id="tema">
        <option value="">Seleccione un tema</option>
        <option value="Música">Música</option>
        <option value="Deporte">Deporte</option>
        <option value="Ciencias">Ciencias</option>
        <option value="Religión">Religión</option>
        <option value="Política">Política</option>
        <option value="Tecnología">Tecnología</option>
        <option value="Juegos">Juegos</option>
        <option value="Baile">Baile</option>
        <option value="Comida">Comida</option>
        <option value="Otro">Otro</option>
      </select>


      <div id="tema-otro-container" style="display: none;">
        <label for="tema-otro">Describe el tema:</label>
        <input type="text" id="tema-otro" name="tema-otro">
      </div>

      <div id="fotos-container">
        <input type="file" id="foto" accept="image/*">
      </div>
      <button type="button" id="agregar-foto">Agregar otra foto</button>
      
      <button type="submit">Agregar esta actividad</button>

    </form>
    
    <div id="mensaje-confirmacion" style="display: none;">
      <p>¿Estás seguro de que quieres enviar esta actividad?</p>
      <button type="button" id="confirmar-si">Sí, estoy seguro</button>
      <button type="button" id="confirmar-no">No, no estoy seguro, quiero volver al formulario</button>

    </div>

    
    <a href="index.html">Volver a la portada</a>
  </main>
</body>
</html>
